<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olamide Olatayo Bello | Business Suite</title><link rel="icon" type="image/png" href="/assets/oob-logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#162c39;font:15px system-ui}aside{position:fixed;width:230px;inset:0 auto 0 0;background:#123f3e;color:white;padding:25px;overflow:auto}h1{font-size:25px}aside button{display:block;width:100%;text-align:left;color:#e9f5f1;background:transparent;border:0;padding:10px;cursor:pointer}aside button:hover,aside button.active{background:#25635c;border-radius:8px}main{margin-left:230px;padding:35px;max-width:1500px}button{background:#166655;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}input,select{padding:11px;border:1px solid #bdcecd;border-radius:6px;width:100%;margin:7px 0}section,.card{background:white;border:1px solid #dce5e5;padding:24px;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.card strong{display:block;font-size:30px;margin-top:15px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e1e9e9;padding:12px}small,.muted{color:#607777}.notice{background:#fff4d8;padding:14px;border-radius:8px}#status{position:sticky;top:0;background:#e2eee9;padding:10px;display:none}label{display:block}header{display:flex;justify-content:space-between;align-items:center}#table{overflow:auto}form{max-width:700px}@media(max-width:700px){aside{position:relative;width:100%;max-height:230px}main{margin:0;padding:18px}}
.brand{background:#fff;border-radius:8px;padding:4px}.brand img{display:block;width:100%;height:auto}.login-brand{display:block;width:min(100%,460px);height:auto;margin:0 auto 20px}aside{background:#083450}aside button:hover,aside button.active{background:#115879}button{background:#247c42}</style><aside><div class="brand"><img src="/assets/oob-logo.png" alt="Olamide Olatayo Bello — Accounting, HR, Payroll, Office Automation" width="1536" height="1024"></div><p>Business workspace</p><nav id="nav"></nav></aside><main><header><div><small>ACCOUNTING · PEOPLE · TAX</small><h1 id="title">Welcome to Olamide Olatayo Bello</h1></div><button id="logout" hidden>Sign out</button></header><p id="status" role="status"></p><div id="content"></div></main><script src="/advanced.js"></script><script>
let csrf='',modules={},current='dashboard';const content=document.querySelector('#content');const title=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(s){let e=document.querySelector('#status');e.textContent=s;e.style.display='block'}async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}function table(rows,keys,edit=false){return '<div id="table"><table><thead><tr>'+keys.map(k=>'<th>'+esc(title(k))+'</th>').join('')+(edit?'<th>Action</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+(edit?'<td><button data-edit="'+r.id+'">Edit</button></td>':'')+'</tr>').join('')+'</tbody></table></div>'}function login(){content.innerHTML='<section><img class="login-brand" src="/assets/oob-logo.png" alt="Olamide Olatayo Bello — Accounting, HR, Payroll, Office Automation" width="1536" height="1024"><h2>Sign in</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{let r=await api('login',Object.fromEntries(new FormData(e.target)));csrf=r.csrf;await boot()}catch(e){message(e.message)}}}async function boot(){try{let me=await api('me');csrf=me.csrf;modules=me.modules;document.querySelector('#logout').hidden=false;document.querySelector('#nav').innerHTML=['dashboard',...Object.keys(modules),'journals','reports','payroll','users',...(me.role==='admin'?['integrations','bank_connections','tax_calculator','payroll_processing','efile','approvals','jobs','recurring']:[])].map(k=>'<button data-page="'+k+'">'+title(k)+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));await show(new URLSearchParams(location.search).has('oauth_state_id')?'bank_connections':'dashboard')}catch(e){login()}}async function show(page){current=page;document.querySelector('#title').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{
if(['integrations','bank_connections','tax_calculator','payroll_processing','efile','approvals','jobs','recurring'].includes(page)){await showAdvanced(page);return}
if(page==='dashboard'){let [inv,bills,staff,rep]=await Promise.all([api('records/invoices'),api('records/bills'),api('records/employees'),api('reports')]);content.innerHTML='<div class="grid">'+[['Invoice records',inv.length],['Bill records',bills.length],['Employees',staff.length],['Journal accounts',rep.trial_balance.length]].map(([a,b])=>'<div class="card">'+a+'<strong>'+b+'</strong></div>').join('')+'</div><section><h2>Your connected business workspace</h2><p>Create customer and vendor records, organize invoices and bills, post balanced journals, manage people, and prepare tax information.</p><p class="notice">Invoices and bills are operational records. Post their accounting entries separately in Journals. Use Payroll Processing for provider calculations and approvals, Tax Calculator for limited estimates, and Integrations to check service readiness.</p></section>';return}
if(modules[page]){let rows=await api('records/'+page), fields=modules[page];content.innerHTML='<section><header><h2>'+title(page)+'</h2><button id="new">New record</button></header><label>Search<input id="search" placeholder="Search records"></label><div id="list"></div></section><section id="editor" hidden></section>';const render=rs=>{document.querySelector('#list').innerHTML=table(rs,fields,true);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(rows.find(r=>r.id==b.dataset.edit)))};render(rows);document.querySelector('#search').oninput=e=>render(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(e.target.value.toLowerCase())));function edit(row={}){let el=document.querySelector('#editor');el.hidden=false;el.innerHTML='<h2>'+ (row.id?'Edit':'New')+' record</h2><form id="record">'+fields.map(f=>'<label>'+title(f)+'<input name="'+f+'" value="'+esc(row[f]||'')+'" '+(f==='name'?'required':'')+'></label>').join('')+'<button>Save and close</button> <button type="button" id="cancel">Cancel</button></form>';document.querySelector('#cancel').onclick=()=>el.hidden=true;document.querySelector('#record').onsubmit=async e=>{e.preventDefault();try{await api('records/'+page,{...Object.fromEntries(new FormData(e.target)),id:row.id});message('Saved');show(page)}catch(e){message(e.message)}}}document.querySelector('#new').onclick=()=>edit();return}
if(page==='reports'){let r=await api('reports');let balanced=r.trial_balance.reduce((s,a)=>s+a.debit-a.credit,0)===0;content.innerHTML='<section><h2>Trial balance</h2><p>Amounts in cents. Ledger balanced: '+balanced+'</p>'+table(r.trial_balance,['code','name','type','debit','credit'])+'<button id="export">Export CSV</button></section><section><h2>Audit trail</h2>'+table(r.audit,['id','user_id','action','created'])+'</section>';document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([['Code,Name,Type,Debit cents,Credit cents',...r.trial_balance.map(x=>[x.code,x.name,x.type,x.debit,x.credit].join(','))].join('\n')],{type:'text/csv'}));a.download='trial-balance.csv';a.click();URL.revokeObjectURL(a.href)};return}
if(page==='journals'){let r=await api('journals');content.innerHTML='<section><h2>Post balanced journal</h2><form id="journal"><label>Memo<input name="memo" required></label>'+['debit','credit'].map(k=>'<label>'+title(k)+' account<select name="'+k+'">'+r.accounts.map(a=>'<option value="'+a.code+'">'+esc(a.code+' '+a.name)+'</option>').join('')+'</select></label>').join('')+'<label>Amount in cents<input type="number" min="1" step="1" name="amount" required></label><button>Post journal</button></form></section><section>'+table(r.journals,['id','memo','created'])+'</section>';document.querySelector('#journal').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(d.debit===d.credit)throw Error('Choose different accounts');await api('journals',{memo:d.memo,lines:[{account:d.debit,debit:Number(d.amount),credit:0},{account:d.credit,debit:0,credit:Number(d.amount)}]});message('Journal posted');show(page)}catch(e){message(e.message)}};return}
if(page==='payroll'){content.innerHTML='<section><h2>Gross pay worksheet</h2><p class="notice">Draft only. Requires verified jurisdiction rules, tax tables, overtime, deductions and a payment provider before live payroll.</p><form id="pay"><label>Hours<input name="hours" type="number" min="0" step="0.01" required></label><label>Hourly rate<input name="rate" type="number" min="0" step="0.01" required></label><button>Preview gross pay</button></form><p id="result"></p></section>';document.querySelector('#pay').onsubmit=async e=>{e.preventDefault();try{let r=await api('payroll/preview',Object.fromEntries(new FormData(e.target)));document.querySelector('#result').textContent='Draft gross pay: '+(r.gross_cents/100).toFixed(2)}catch(e){message(e.message)}};return}
if(page==='users'){content.innerHTML='<section><h2>Invite by creating an account</h2><p>Administrator access required. Share credentials separately using your approved secure process.</p><form id="user"><label>Email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="14" required></label><label>Role<select name="role"><option>viewer</option><option>editor</option><option>admin</option></select></label><button>Create user</button></form></section>';document.querySelector('#user').onsubmit=async e=>{e.preventDefault();try{await api('users',Object.fromEntries(new FormData(e.target)));e.target.reset();message('User created')}catch(e){message(e.message)}}}
}catch(e){message(e.message)}}document.querySelector('#logout').onclick=async()=>{await api('logout',{});location.reload()};boot();
</script></html>
