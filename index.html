<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olamide Olatayo Bello | Business Suite</title><link rel="icon" type="image/png" href="/assets/oob-logo.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#162c39;font:15px system-ui}aside{position:fixed;width:230px;inset:0 auto 0 0;background:#123f3e;color:white;padding:25px;overflow:auto}h1{font-size:25px}aside button{display:block;width:100%;text-align:left;color:#e9f5f1;background:transparent;border:0;padding:10px;cursor:pointer}aside button:hover,aside button.active{background:#25635c;border-radius:8px}main{margin-left:230px;padding:35px;max-width:1500px}button{background:#166655;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}input,select{padding:11px;border:1px solid #bdcecd;border-radius:6px;width:100%;margin:7px 0}section,.card{background:white;border:1px solid #dce5e5;padding:24px;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.card strong{display:block;font-size:30px;margin-top:15px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e1e9e9;padding:12px}small,.muted{color:#607777}.notice{background:#fff4d8;padding:14px;border-radius:8px}#status{position:sticky;top:0;background:#e2eee9;padding:10px;display:none}label{display:block}header{display:flex;justify-content:space-between;align-items:center}#table{overflow:auto}form{max-width:700px}@media(max-width:700px){aside{position:relative;width:100%;max-height:230px}main{margin:0;padding:18px}}
.brand{background:#fff;border-radius:8px;padding:4px}.brand img{display:block;width:100%;height:auto}.login-brand{display:block;width:min(100%,460px);height:auto;margin:0 auto 20px}aside{background:#083450}aside button:hover,aside button.active{background:#115879}button{background:#247c42}
[hidden]{display:none!important}body.auth aside{display:none}body.auth main{margin:0;max-width:520px;padding:20px;margin-inline:auto}body.auth header{display:none}body.auth section{margin:0;padding:24px}body.auth .login-brand{width:220px;max-width:100%;height:auto;margin:0 auto 12px}body.auth h2{margin:12px 0 16px}body.auth form button{width:100%;min-height:44px;margin-top:10px}body.auth #status{position:static;margin:0 0 12px;overflow-wrap:anywhere}input,select{font:inherit;font-size:16px;min-width:0}button,a{touch-action:manipulation}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d1a83c;outline-offset:2px}header{gap:12px}header>div{min-width:0}h1{overflow-wrap:anywhere}section,.card{min-width:0}.table-scroll{max-width:100%;overflow:auto}nav{display:grid}#content>table{display:block;overflow:auto}#retry-connection{min-height:44px}@media(max-width:700px){body:not(.auth) aside{max-height:none;padding:12px}body:not(.auth) .brand{max-width:160px}body:not(.auth) aside>p{margin:8px 0}body:not(.auth) nav{display:flex;overflow-x:auto;gap:4px}body:not(.auth) nav button{flex:0 0 auto;width:auto;white-space:nowrap;min-height:44px}main{padding:16px}section,.card{padding:16px}body.auth main{padding:16px}body.auth section{padding:20px}body.auth .login-brand{width:200px}h1{font-size:22px}}
</style><body class="auth"><aside><div class="brand"><img src="/assets/oob-logo.png" alt="Olamide Olatayo Bello — Accounting, HR, Payroll, Office Automation" width="1536" height="1024"></div><p>Business workspace</p><nav id="nav"></nav></aside><main><header><div><small id="workspace-label">ACCOUNTING · PEOPLE · TAX</small><h1 id="title">Welcome to Olamide Olatayo Bello</h1></div><button id="logout" hidden>Sign out</button></header><p id="status" role="status"></p><div id="content"></div></main><script src="/advanced.js"></script><script>
let selectedTenant=sessionStorage.getItem('oobTenant')||'',userRole='',csrf='',modules={},current='dashboard';const content=document.querySelector('#content');const title=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(s){let e=document.querySelector('#status');e.textContent=s;e.style.display='block'}async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...(selectedTenant?{'X-Tenant-ID':selectedTenant}:{})},body:data?JSON.stringify(data):undefined});let j;try{j=await r.json()}catch{throw Error('The server returned an unexpected response. Please try again.')}if(!r.ok){const error=Error(j.error||'Request failed. Please try again.');error.status=r.status;throw error}return j}function table(rows,keys,edit=false){return '<div class="table-scroll"><table><thead><tr>'+keys.map(k=>'<th>'+esc(title(k))+'</th>').join('')+(edit?'<th>Action</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+(edit?'<td><button data-edit="'+r.id+'">Edit</button></td>':'')+'</tr>').join('')+'</tbody></table></div>'}function authView(){document.body.classList.add('auth');document.querySelector('#nav').innerHTML='';document.querySelector('#logout').hidden=true;userRole='';csrf=''}function login(){authView();content.innerHTML='<section><img class="login-brand" src="/assets/oob-logo.png" alt="Olamide Olatayo Bello — Accounting, HR, Payroll, Office Automation" width="1536" height="1024"><h2>Sign in</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p><a href="/register">Create a business account</a></p></section>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{selectedTenant='';sessionStorage.removeItem('oobTenant');let r=await api('login',Object.fromEntries(new FormData(e.target)));csrf=r.csrf;await boot()}catch(e){message(e.message)}finally{button.disabled=false}}}function registration(){authView();document.querySelector('#title').textContent='Create your business workspace';document.querySelector('#nav').innerHTML='';content.innerHTML=`<section><img class="login-brand" src="/assets/oob-logo.png" alt="Olamide Olatayo Bello"><h2>Register your business</h2><p>Create a separate workspace for your accounting, employees and office operations.</p><form id="registration"><label>Business name<input name="company" maxlength="150" autocomplete="organization" required></label><label>Work email<input name="email" type="email" autocomplete="username" required></label><label>Password (at least 14 characters)<input name="password" type="password" minlength="14" maxlength="1024" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="14" autocomplete="new-password" required></label><button>Create business account</button></form><p><a href="/">Already registered? Sign in</a></p></section>`;document.querySelector('#registration').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));if(body.password!==body.confirm_password){message('Passwords do not match');return}const button=e.target.querySelector('button');button.disabled=true;try{const response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json','X-Registration-Request':'1'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);selectedTenant='';sessionStorage.removeItem('oobTenant');await api('login',{email:body.email,password:body.password});history.replaceState({},'','/');await boot();message('Your business workspace is ready')}catch(error){message(error.message);button.disabled=false}}}
function setup(){authView();document.querySelector('#title').textContent='Set up your business workspace';document.querySelector('#nav').innerHTML='';document.querySelector('#logout').hidden=true;content.innerHTML='<section><img class="login-brand" src="/assets/oob-logo.png" alt="Olamide Olatayo Bello"><h2>Create your super administrator</h2><p>Use the one-time setup token provided on your server. This account manages users and all business modules.</p><form id="setup"><label>Setup token<input name="token" type="password" autocomplete="off" required></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password (at least 14 characters)<input name="password" type="password" minlength="14" maxlength="1024" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="14" autocomplete="new-password" required></label><button>Create super administrator</button></form></section>';document.querySelector('#setup').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.password!==data.confirm_password){message('Passwords do not match');return}const button=e.target.querySelector('button');button.disabled=true;try{const response=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Request':'1'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);await api('login',{email:data.email.trim().toLowerCase(),password:data.password});history.replaceState({},'', '/');message('Super administrator created');await boot()}catch(error){message(error.message);button.disabled=false}}}
async function boot(){try{let setupState=await api('setup/status');if(setupState.required){setup();return}if(location.pathname.startsWith('/register')){registration();return}if(location.pathname.startsWith('/setup'))message('Setup is complete. Sign in with your existing administrator account.');let me=await api('me');document.body.classList.remove('auth');document.querySelector('#status').style.display='none';userRole=me.role;document.querySelector('#workspace-label').textContent=me.tenant.name;csrf=me.csrf;modules=me.modules;document.querySelector('#logout').hidden=false;document.querySelector('#nav').innerHTML=['dashboard',...(me.role==='super_admin'?['super_admin','tenants']:[]),...Object.keys(modules),'journals','reports','payroll',...(['admin','super_admin'].includes(me.role)?['users']:[]),...(['admin','super_admin'].includes(me.role)?['integrations','bank_connections','tax_calculator','payroll_processing','efile','approvals','jobs','recurring']:[])].map(k=>'<button data-page="'+k+'">'+title(k)+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));await show(new URLSearchParams(location.search).has('oauth_state_id')?'bank_connections':(me.role==='super_admin'?'super_admin':'dashboard'))}catch(e){if(selectedTenant&&[403,404].includes(e.status)){selectedTenant='';sessionStorage.removeItem('oobTenant');await boot();return}if(e.status===401){login();return}authView();content.innerHTML='<section><h2>Unable to load workspace</h2><p>Please check your connection and try again.</p><button id="retry-connection">Try again</button></section>';message(e.message);document.querySelector('#retry-connection').onclick=()=>boot()}}async function show(page){current=page;document.querySelector('#title').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{
if(['integrations','bank_connections','tax_calculator','payroll_processing','efile','approvals','jobs','recurring'].includes(page)){await showAdvanced(page);return}
if(page==='tenants'){const tenants=await api('tenants');content.innerHTML=`<section><h2>Business workspaces</h2><p>Each workspace has a separate business database. Select a workspace to manage its users and records.</p><table><thead><tr><th>Workspace</th><th>Status</th><th>Users</th><th>Actions</th></tr></thead><tbody>${tenants.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.status)}</td><td>${t.user_count}</td><td>${t.status==='active'?`<button data-select-tenant="${t.id}">Open workspace</button>`:''} ${t.id!==1?`<button data-status-tenant="${t.id}" data-next-status="${t.status==='active'?'suspended':'active'}">${t.status==='active'?'Suspend':'Activate'}</button>`:''}</td></tr>`).join('')}</tbody></table><h3>Create a workspace and its administrator</h3><form id="tenant-create"><label>Business name<input name="company" required maxlength="150"></label><label>Administrator email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="14" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="14" required></label><button>Create workspace</button></form></section>`;content.querySelectorAll('[data-select-tenant]').forEach(b=>b.onclick=async()=>{selectedTenant=b.dataset.selectTenant;sessionStorage.setItem('oobTenant',selectedTenant);await boot()});content.querySelectorAll('[data-status-tenant]').forEach(b=>b.onclick=async()=>{try{await api('tenants',{action:'status',tenant_id:b.dataset.statusTenant,status:b.dataset.nextStatus});await show('tenants')}catch(error){message(error.message)}});document.querySelector('#tenant-create').onsubmit=async e=>{e.preventDefault();try{await api('tenants',Object.fromEntries(new FormData(e.target)));await show('tenants');message('Workspace and administrator created')}catch(error){message(error.message)}};return}
if(page==='super_admin'){const users=await api('users');content.innerHTML='<section><h2>Super administrator console</h2><p>Manage user access, business operations, integrations, approval workflows and audit history.</p><div class="grid">'+[['Users',users.length],['Administrators',users.filter(u=>['admin','super_admin'].includes(u.role)).length],['Business modules',Object.keys(modules).length]].map(([label,count])=>'<div class="card">'+label+'<strong>'+count+'</strong></div>').join('')+'</div><p><button data-admin-page="tenants">Manage workspaces</button> <button data-admin-page="users">Manage users</button> <button data-admin-page="integrations">Configure integrations</button> <button data-admin-page="approvals">Review approvals</button> <button data-admin-page="reports">Reports and audit</button></p></section>';content.querySelectorAll('[data-admin-page]').forEach(b=>b.onclick=()=>show(b.dataset.adminPage));return}
if(page==='dashboard'){let [inv,bills,staff,rep]=await Promise.all([api('records/invoices'),api('records/bills'),api('records/employees'),api('reports')]);content.innerHTML='<div class="grid">'+[['Invoice records',inv.length],['Bill records',bills.length],['Employees',staff.length],['Journal accounts',rep.trial_balance.length]].map(([a,b])=>'<div class="card">'+a+'<strong>'+b+'</strong></div>').join('')+'</div><section><h2>Your connected business workspace</h2><p>Create customer and vendor records, organize invoices and bills, post balanced journals, manage people, and prepare tax information.</p><p class="notice">Invoices and bills are operational records. Post their accounting entries separately in Journals. Use Payroll Processing for provider calculations and approvals, Tax Calculator for limited estimates, and Integrations to check service readiness.</p></section>';return}
if(modules[page]){let rows=await api('records/'+page), fields=modules[page];content.innerHTML='<section><header><h2>'+title(page)+'</h2><button id="new">New record</button></header><label>Search<input id="search" placeholder="Search records"></label><div id="list"></div></section><section id="editor" hidden></section>';const render=rs=>{document.querySelector('#list').innerHTML=table(rs,fields,true);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(rows.find(r=>r.id==b.dataset.edit)))};render(rows);document.querySelector('#search').oninput=e=>render(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(e.target.value.toLowerCase())));function edit(row={}){let el=document.querySelector('#editor');el.hidden=false;el.innerHTML='<h2>'+ (row.id?'Edit':'New')+' record</h2><form id="record">'+fields.map(f=>'<label>'+title(f)+'<input name="'+f+'" value="'+esc(row[f]||'')+'" '+(f==='name'?'required':'')+'></label>').join('')+'<button>Save and close</button> <button type="button" id="cancel">Cancel</button></form>';document.querySelector('#cancel').onclick=()=>el.hidden=true;document.querySelector('#record').onsubmit=async e=>{e.preventDefault();try{await api('records/'+page,{...Object.fromEntries(new FormData(e.target)),id:row.id});message('Saved');show(page)}catch(e){message(e.message)}}}document.querySelector('#new').onclick=()=>edit();return}
if(page==='reports'){let r=await api('reports');let balanced=r.trial_balance.reduce((s,a)=>s+a.debit-a.credit,0)===0;content.innerHTML='<section><h2>Trial balance</h2><p>Amounts in cents. Ledger balanced: '+balanced+'</p>'+table(r.trial_balance,['code','name','type','debit','credit'])+'<button id="export">Export CSV</button></section><section><h2>Audit trail</h2>'+table(r.audit,['id','user_id','action','created'])+'</section>';document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([['Code,Name,Type,Debit cents,Credit cents',...r.trial_balance.map(x=>[x.code,x.name,x.type,x.debit,x.credit].join(','))].join('\n')],{type:'text/csv'}));a.download='trial-balance.csv';a.click();URL.revokeObjectURL(a.href)};return}
if(page==='journals'){let r=await api('journals');content.innerHTML='<section><h2>Post balanced journal</h2><form id="journal"><label>Memo<input name="memo" required></label>'+['debit','credit'].map(k=>'<label>'+title(k)+' account<select name="'+k+'">'+r.accounts.map(a=>'<option value="'+a.code+'">'+esc(a.code+' '+a.name)+'</option>').join('')+'</select></label>').join('')+'<label>Amount in cents<input type="number" min="1" step="1" name="amount" required></label><button>Post journal</button></form></section><section>'+table(r.journals,['id','memo','created'])+'</section>';document.querySelector('#journal').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(d.debit===d.credit)throw Error('Choose different accounts');await api('journals',{memo:d.memo,lines:[{account:d.debit,debit:Number(d.amount),credit:0},{account:d.credit,debit:0,credit:Number(d.amount)}]});message('Journal posted');show(page)}catch(e){message(e.message)}};return}
if(page==='payroll'){content.innerHTML='<section><h2>Gross pay worksheet</h2><p class="notice">Draft only. Requires verified jurisdiction rules, tax tables, overtime, deductions and a payment provider before live payroll.</p><form id="pay"><label>Hours<input name="hours" type="number" min="0" step="0.01" required></label><label>Hourly rate<input name="rate" type="number" min="0" step="0.01" required></label><button>Preview gross pay</button></form><p id="result"></p></section>';document.querySelector('#pay').onsubmit=async e=>{e.preventDefault();try{let r=await api('payroll/preview',Object.fromEntries(new FormData(e.target)));document.querySelector('#result').textContent='Draft gross pay: '+(r.gross_cents/100).toFixed(2)}catch(e){message(e.message)}};return}
if(page==='users'){const accounts=await api('users');content.innerHTML=table(accounts,['id','email','role'])+'<section><h2>User administration</h2><p>Administrator access required. Share credentials separately using your approved secure process.</p><form id="user"><label>Email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="14" required></label><label>Role<select name="role"><option>viewer</option><option>editor</option><option>admin</option>'+ (userRole==='super_admin'?'<option>super_admin</option>':'') +'</select></label><button>Create user</button></form></section>';document.querySelector('#user').onsubmit=async e=>{e.preventDefault();try{await api('users',Object.fromEntries(new FormData(e.target)));e.target.reset();await show('users');message('User created')}catch(e){message(e.message)}}}
}catch(e){message(e.message)}}document.querySelector('#logout').onclick=async()=>{await api('logout',{});sessionStorage.removeItem('oobTenant');location.href='/'};boot();
</script></body></html>
