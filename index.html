if(page==='deployment'){await showDeployment();return}
if(page==='downloads'){await showDownloads();return}
if(modules[page]){await showRecords(page);return}
if(page==='reports'){let r=await api('reports');let balanced=r.trial_balance.reduce((s,a)=>s+a.debit-a.credit,0)===0;content.innerHTML='<section><h2>Trial balance</h2><p>Amounts in cents. Ledger balanced: '+balanced+'</p>'+table(r.trial_balance,['code','name','type','debit','credit'])+'<button id="export">Export CSV</button></section><section><h2>Audit trail</h2>'+table(r.audit,['id','user_id','action','created'])+'</section>';document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([['Code,Name,Type,Debit cents,Credit cents',...r.trial_balance.map(x=>[x.code,x.name,x.type,x.debit,x.credit].join(','))].join('\n')],{type:'text/csv'}));a.download='trial-balance.csv';a.click();URL.revokeObjectURL(a.href)};return}
if(page==='journals'){let r=await api('journals');content.innerHTML='<section class="write-only"><h2>Post balanced journal</h2><form id="journal"><label>Memo<input name="memo" required></label>'+['debit','credit'].map(k=>'<label>'+title(k)+' account<select name="'+k+'">'+r.accounts.map(a=>'<option value="'+a.code+'">'+esc(a.code+' '+a.name)+'</option>').join('')+'</select></label>').join('')+'<label>Amount in cents<input type="number" min="1" step="1" name="amount" required></label><button>Post journal</button></form></section><section>'+table(r.journals,['id','memo','created'])+'</section>';document.querySelector('#journal').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(d.debit===d.credit)throw Error('Choose different accounts');await api('journals',{memo:d.memo,lines:[{account:d.debit,debit:Number(d.amount),credit:0},{account:d.credit,debit:0,credit:Number(d.amount)}]});message('Journal posted');show(page)}catch(e){message(e.message)}};return}
if(page==='payroll'){content.innerHTML='<section><h2>Gross pay worksheet</h2><p class="notice">Draft only. Requires verified jurisdiction rules, tax tables, overtime, deductions and a payment provider before live payroll.</p><form id="pay"><label>Hours<input name="hours" type="number" min="0" step="0.01" required></label><label>Hourly rate<input name="rate" type="number" min="0" step="0.01" required></label><button>Preview gross pay</button></form><p id="result"></p></section>';document.querySelector('#pay').onsubmit=async e=>{e.preventDefault();try{let r=await api('payroll/preview',Object.fromEntries(new FormData(e.target)));document.querySelector('#result').textContent='Draft gross pay: '+(r.gross_cents/100).toFixed(2)}catch(e){message(e.message)}};return}
if(page==='users'){const accounts=await api('users');content.innerHTML=table(accounts,['id','email','role'])+'<section><h2>User administration</h2><p>Administrator access required. Share credentials separately using your approved secure process.</p><form id="user"><label>Email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="14" required></label><label>Role<select name="role"><option>viewer</option><option>editor</option><option>admin</option>'+ (userRole==='super_admin'?'<option>super_admin</option>':'') +'</select></label><button>Create user</button></form></section>';document.querySelector('#user').onsubmit=async e=>{e.preventDefault();try{await api('users',Object.fromEntries(new FormData(e.target)));e.target.reset();await show('users');message('User created')}catch(e){message(e.message)}};wireAdminPasswordReset()}
}catch(e){message(e.message)}}document.querySelector('#logout').onclick=async()=>{await api('logout',{});sessionStorage.removeItem('oobTenant');sessionStorage.removeItem('dobhrap_plaid_link');location.href='/'};wireWorkspaceActions();boot();
</script></body></html>
