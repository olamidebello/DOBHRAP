---
# Install complete recovery wiring, then optionally recover one existing owner.
- import_playbook: install-password-reset-oob.yml

- name: Optionally issue a private owner recovery link after verified installation
  hosts: dobhrap
  become: true
  gather_facts: false
  vars:
    recovery_email: dobcalldemo@gmail.com
    reset_service: oob-business.service
  tasks:
    - name: Issue recovery link using the live service backend
      ansible.builtin.command:
        argv: [/opt/dobhrap/current/venv/bin/python, /opt/dobhrap/current/ansible/recover-password.py, --email, '{{ recovery_email }}', --service, '{{ reset_service }}']
      no_log: true
      when: password_issue_recovery | default(false) | bool
    - name: Report installed account features
      ansible.builtin.debug:
        msg:
          - 'Installed: sign in, forgot password, reset completion, change password, administrator recovery and password visibility controls.'
          - 'Recovery tables verified using the running SQLite or MySQL backend. Backup: /var/backups/oob-password-repair.'
          - 'Email delivery requires SMTP configuration under Provider provisioning & keys > Password recovery email.'
          - 'When password_issue_recovery=true, read the private 15-minute link with: sudo cat /root/oob-password-reset-link.txt'
