---
- import_playbook: repair-oob.yml

- name: Provision local credentials and verify the administration GUI
  hosts: dobhrap
  become: true
  gather_facts: false
  tasks:
    - name: Generate persistent application-owned integration credentials
      ansible.builtin.script:
        cmd: provision-gui.py
        executable: /opt/dobhrap/current/venv/bin/python
      register: gui_provision
      changed_when: false
    - name: Verify support automation and provisioning schedulers
      ansible.builtin.command:
        argv: [systemctl, is-active, '{{ item }}']
      loop: [oob-business.service, oob-business-support.timer, oob-business-bank-import.timer, oob-business-marketplace.timer, oob-admin.timer]
      changed_when: false
    - name: Confirm support and provisioning frontend asset is served
      ansible.builtin.uri:
        url: https://olamideolatayobello.com/support-ui.js
        status_code: 200
        return_content: true
      register: provision_gui_asset
    - name: Assert provisioning and support functions are present
      ansible.builtin.assert:
        that:
          - "'showProviderSettings' in provision_gui_asset.content"
          - "'showSupport' in provision_gui_asset.content"
    - name: Report readiness without credentials
      ansible.builtin.debug:
        msg:
          - Application encryption and first-run setup credentials are generated by deployment and preserved on reruns.
          - The support intake credential is generated once and encrypted. Rotate it from the super admin GUI when needed.
          - Sign in -> Provider provisioning & keys -> save provider-issued credentials -> test connections -> profile readiness.
          - Provider accounts, API approval and merchant identity verification must be completed with each provider.
          - Stripe webhook provisioning is available from the GUI; configure Paystack webhook URL in its dashboard.
          - 'Safe readiness report: /var/log/oob-provision-readiness.json'
