---
- name: Build, test, migrate and deploy DOBHRAP
  hosts: dobhrap
  become: true
  vars:
    app_root: /opt/dobhrap
    service_user: dobhrap-app
    service_name: oob-business
    domain: olamideolatayobello.com
    app_port: 18081
    replace_domain_config: false
    admin_email: admin@example.com
    app_source: "{{ playbook_dir }}/.."
    plaid_env: sandbox
    check_env: sandbox
    enable_live_banking: false
    enable_live_payroll: false
    enable_efile_transmission: false
  pre_tasks:
    - name: Evaluate configuration without exposing credentials
      ansible.builtin.set_fact:
        deployment_checks:
          - name: Optional legacy administrator password must be empty or contain at least 14 characters
            valid: "{{ (admin_password | default('') | string | length) == 0 or (admin_password | default('') | string | length) >= 14 }}"
          - name: Domain must contain only letters, digits, dots and hyphens
            valid: "{{ domain is match('^[A-Za-z0-9.-]+$') }}"
          - name: Plaid environment must be sandbox or production
            valid: "{{ plaid_env in ['sandbox', 'production'] }}"
          - name: Check environment must be sandbox or production
            valid: "{{ check_env in ['sandbox', 'production'] }}"
          - name: Live banking requires Plaid client ID and secret
            valid: "{{ not (enable_live_banking | bool) or ((plaid_client_id | default('') | length > 0) and (plaid_secret | default('') | length > 0)) }}"
          - name: Live payroll requires a Check API key
            valid: "{{ not (enable_live_payroll | bool) or (check_api_key | default('') | length > 0) }}"
          - name: E-filing transmission requires an HTTPS gateway and token
            valid: "{{ not (enable_efile_transmission | bool) or ((efile_gateway_url | default('') is match('^https://')) and (efile_gateway_token | default('') | length > 0)) }}"
      no_log: true
    - name: Validate deployment settings with safe diagnostic messages
      ansible.builtin.assert:
        that: item.valid | bool
        fail_msg: "{{ item.name }}. Correct this setting and rerun deployment."
        quiet: true
      loop: "{{ deployment_checks }}"
      loop_control:
        label: "{{ item.name }}"
    - name: Hash branding asset on controller
      ansible.builtin.stat:
        path: "{{ app_source }}/assets/oob-logo.png"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: branding_asset
    - name: Derive immutable source release ID
      ansible.builtin.set_fact:
        release_id: "{{ (branding_asset.stat.checksum + lookup('file', app_source + '/app.py') + lookup('file', app_source + '/advanced.py') + lookup('file', app_source + '/worker.py') + lookup('file', app_source + '/backup.py') + lookup('file', app_source + '/index.html') + lookup('file', app_source + '/advanced.js') + lookup('file', app_source + '/requirements.txt') + lookup('file', app_source + '/tests/test_app.py') + lookup('file', app_source + '/tests/test_advanced.py') + lookup('file', app_source + '/tests/test_setup.py')) | hash('sha256') }}"
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [python3, python3-venv, nginx, certbot, python3-certbot-nginx, curl]
        update_cache: true
        state: present
    - name: Inspect dedicated application account
      ansible.builtin.getent:
        database: passwd
        key: "{{ service_user }}"
        fail_key: false
    - name: Create dedicated application group
      ansible.builtin.group:
        name: "{{ service_user }}"
        system: true
    - name: Create dedicated application account only when absent
      ansible.builtin.user:
        name: "{{ service_user }}"
        group: "{{ service_user }}"
        system: true
        home: "{{ app_root }}"
        create_home: false
        shell: /usr/sbin/nologin
      when: ansible_facts.getent_passwd[service_user] is none
    - name: Prepare release and persistent directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ service_user }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ app_root }}", owner: root, mode: '0750'}
        - {path: "{{ app_root }}/releases", owner: root, mode: '0750'}
        - {path: "{{ app_root }}/releases/{{ release_id }}", owner: root, mode: '0750'}
        - {path: "{{ app_root }}/releases/{{ release_id }}/assets", owner: root, mode: '0750'}
        - {path: "{{ app_root }}/releases/{{ release_id }}/tests", owner: root, mode: '0750'}
        - {path: /var/lib/dobhrap, owner: "{{ service_user }}", mode: '0700'}
        - {path: /var/backups/dobhrap, owner: "{{ service_user }}", mode: '0700'}
    - name: Copy versioned source
      ansible.builtin.copy:
        src: "{{ app_source }}/{{ item }}"
        dest: "{{ app_root }}/releases/{{ release_id }}/{{ item }}"
        owner: root
        group: "{{ service_user }}"
        mode: '0640'
      loop: [assets/oob-logo.png, app.py, advanced.py, worker.py, backup.py, index.html, advanced.js, requirements.txt, tests/test_app.py, tests/test_advanced.py, tests/test_setup.py]
    - name: Create isolated build environment and install pinned dependencies
      ansible.builtin.pip:
        requirements: "{{ app_root }}/releases/{{ release_id }}/requirements.txt"
        virtualenv: "{{ app_root }}/releases/{{ release_id }}/venv"
        virtualenv_command: python3 -m venv
    - name: Run release tests before activation
      ansible.builtin.command:
        argv: ["{{ app_root }}/releases/{{ release_id }}/venv/bin/python", -m, unittest, discover, -s, tests, -v]
        chdir: "{{ app_root }}/releases/{{ release_id }}"
      changed_when: false
    - name: Generate private first-run setup token once
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import secrets,os; fd=os.open('/etc/dobhrap-setup.token',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(fd,secrets.token_urlsafe(32).encode()); os.close(fd)"
        creates: /etc/dobhrap-setup.token
      no_log: true
    - name: Read private setup token
      ansible.builtin.slurp:
        src: /etc/dobhrap-setup.token
      register: setup_token
      no_log: true
    - name: Generate persistent encryption key once
      ansible.builtin.command:
        argv:
          - "{{ app_root }}/releases/{{ release_id }}/venv/bin/python"
          - -c
          - "from cryptography.fernet import Fernet; import os; fd=os.open('/etc/dobhrap-encryption.key',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(fd,Fernet.generate_key()); os.close(fd)"
        creates: /etc/dobhrap-encryption.key
      no_log: true
    - name: Read encryption key without logging
      ansible.builtin.slurp:
        src: /etc/dobhrap-encryption.key
      register: encryption_key
      no_log: true
    - name: Install private runtime settings
      ansible.builtin.copy:
        dest: /etc/dobhrap.env
        owner: root
        mode: '0600'
        content: |
          PORT={{ app_port }}
          DOBHRAP_DB=/var/lib/dobhrap/dobhrap.db
          DOBHRAP_ADMIN_EMAIL={{ admin_email | to_json }}
          DOBHRAP_ADMIN_PASSWORD={{ admin_password | default('') | to_json }}
          DOBHRAP_SETUP_TOKEN={{ (setup_token.content | b64decode) | to_json }}
          DOBHRAP_SECURE_COOKIE=1
          DOBHRAP_ENCRYPTION_KEY={{ (encryption_key.content | b64decode) | to_json }}
          PLAID_ENV={{ plaid_env }}
          PLAID_CLIENT_ID={{ plaid_client_id | default('') | to_json }}
          PLAID_SECRET={{ plaid_secret | default('') | to_json }}
          PLAID_REDIRECT_URI={{ plaid_redirect_uri | default('') | to_json }}
          DOBHRAP_ENABLE_LIVE_BANKING={{ '1' if enable_live_banking else '0' }}
          CHECK_ENV={{ check_env }}
          CHECK_API_KEY={{ check_api_key | default('') | to_json }}
          DOBHRAP_ENABLE_LIVE_PAYROLL={{ '1' if enable_live_payroll else '0' }}
          EFILE_GATEWAY_URL={{ efile_gateway_url | default('') | to_json }}
          EFILE_GATEWAY_TOKEN={{ efile_gateway_token | default('') | to_json }}
          DOBHRAP_ENABLE_EFILE_TRANSMISSION={{ '1' if enable_efile_transmission else '0' }}
      no_log: true
      notify: Restart DOBHRAP
    - name: Stop background processing during migration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: ["{{ service_name }}-worker.timer", "{{ service_name }}-worker.service"]
      failed_when: false
    - name: Inspect installed application services
      ansible.builtin.service_facts:
    - name: Stop existing web and backup services before data ownership migration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: ["{{ service_name }}.service", "{{ service_name }}-backup.timer", "{{ service_name }}-backup.service"]
      when: item in ansible_facts.services
    - name: Assign persistent application data to dedicated service account
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        recurse: true
        state: directory
      loop: [/var/lib/dobhrap, /var/backups/dobhrap]
    - name: Save pre-migration database snapshot if present
      ansible.builtin.command:
        argv: ["{{ app_root }}/releases/{{ release_id }}/venv/bin/python", "{{ app_root }}/releases/{{ release_id }}/backup.py"]
      environment:
        DOBHRAP_DB: /var/lib/dobhrap/dobhrap.db
      become_user: "{{ service_user }}"
      vars:
        ansible_remote_tmp: /tmp/.ansible-oob-app
      changed_when: false
    - name: Activate tested source atomically
      ansible.builtin.file:
        src: "{{ app_root }}/releases/{{ release_id }}"
        dest: "{{ app_root }}/current"
        state: link
      notify: Restart DOBHRAP
    - name: Install restricted service units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}.service"
        mode: '0644'
        content: |
          [Unit]
          Description={{ item.description }}
          After=network.target
          [Service]
          Type={{ item.type }}
          User={{ service_user }}
          Group={{ service_user }}
          WorkingDirectory={{ app_root }}/current
          EnvironmentFile=/etc/dobhrap.env
          ExecStart={{ app_root }}/current/venv/bin/python {{ app_root }}/current/{{ item.script }}
          {{ item.restart }}
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ReadWritePaths=/var/lib/dobhrap /var/backups/dobhrap
          UMask=0077
          [Install]
          WantedBy=multi-user.target
      loop:
        - {name: "{{ service_name }}", description: DOBHRAP web service, type: simple, script: app.py, restart: 'Restart=on-failure'}
        - {name: "{{ service_name }}-worker", description: DOBHRAP approval job worker, type: oneshot, script: worker.py, restart: 'TimeoutStartSec=180'}
        - {name: "{{ service_name }}-backup", description: DOBHRAP database backup, type: oneshot, script: backup.py, restart: 'TimeoutStartSec=180'}
      notify: Restart DOBHRAP
    - name: Install background timers
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}.timer"
        mode: '0644'
        content: |
          [Unit]
          Description={{ item.name }} schedule
          [Timer]
          {% if item.name == service_name + '-worker' %}
          OnUnitInactiveSec=60s
          OnBootSec=60s
          {% else %}
          OnCalendar=daily
          Persistent=true
          {% endif %}
          Unit={{ item.name }}.service
          [Install]
          WantedBy=timers.target
      loop:
        - {name: "{{ service_name }}-worker"}
        - {name: "{{ service_name }}-backup"}
    - name: Verify generated systemd timers and services before activation
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - "/etc/systemd/system/{{ service_name }}.service"
          - "/etc/systemd/system/{{ service_name }}-worker.service"
          - "/etc/systemd/system/{{ service_name }}-backup.service"
          - "/etc/systemd/system/{{ service_name }}-worker.timer"
          - "/etc/systemd/system/{{ service_name }}-backup.timer"
      changed_when: false
    - name: Install nginx login throttling
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/dobhrap-upstream.conf
        mode: '0644'
        content: |
          limit_req_zone $binary_remote_addr zone=dobhrap_login:10m rate=5r/m;
    - name: Retire competing domain entries with backups and syntax validation
      ansible.builtin.script:
        cmd: "retire-domain.py {{ domain }} /etc/nginx/sites-available/{{ domain }}"
        executable: python3
      when: replace_domain_config | bool
      register: domain_cleanup
      changed_when: "'Updated ' in domain_cleanup.stdout"
    - name: Install domain configuration
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ domain }}"
        force: "{{ replace_domain_config | bool }}"
        backup: true
        mode: '0644'
        content: |
          server {
            listen 80;
            {% if ansible_facts.all_ipv6_addresses | default([]) | length > 0 %}
            listen [::]:80;
            {% endif %}
            server_name {{ domain }};
            client_max_body_size 100k;
            location = /api/login {
              limit_req zone=dobhrap_login burst=5 nodelay;
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_set_header Host $host;
            }
            location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_read_timeout 180s;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
    - name: Enable domain
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ domain }}"
        dest: "/etc/nginx/sites-enabled/{{ domain }}"
        state: link
    - name: Validate nginx
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Apply service updates and run automatic schema migrations at startup
      ansible.builtin.meta: flush_handlers
    - name: Enable services and timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: ["{{ service_name }}", "{{ service_name }}-worker.timer", "{{ service_name }}-backup.timer"]
    - name: Verify application identity on the selected private port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/api/identity"
        status_code: 200
      register: private_identity
      retries: 10
      delay: 2
      until: private_identity.status == 200 and (private_identity.json.application | default('')) == 'oob-business-suite'
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: reloaded
    - name: Provision HTTPS
      ansible.builtin.command:
        argv: [certbot, --nginx, --non-interactive, --agree-tos, --redirect, --keep-until-expiring, --cert-name, "{{ domain }}", -m, "{{ admin_email }}", -d, "{{ domain }}"]
      register: certificate
      changed_when: "'no action taken' not in certificate.stdout"
    - name: Confirm certificate files for managed HTTPS routing
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain }}/{{ item }}"
      loop: [fullchain.pem, privkey.pem]
      register: domain_certificates
    - name: Require certificate material before routing HTTPS
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: Certificate provisioning did not create the expected certificate files.
      loop: "{{ domain_certificates.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Install explicit managed IPv4 and IPv6 HTTPS proxy
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ domain }}"
        backup: true
        mode: '0644'
        content: |
          server {
            listen 80;
            {% if ansible_facts.all_ipv6_addresses | default([]) | length > 0 %}
            listen [::]:80;
            {% endif %}
            server_name {{ domain }};
            return 301 https://{{ domain }}$request_uri;
          }
          server {
            listen 443 ssl;
            {% if ansible_facts.all_ipv6_addresses | default([]) | length > 0 %}
            listen [::]:443 ssl;
            {% endif %}
            server_name {{ domain }};
            ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            client_max_body_size 100k;
            location = /api/login {
              limit_req zone=dobhrap_login burst=5 nodelay;
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
            }
            location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_read_timeout 180s;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
            }
          }
    - name: Remove competing HTTPS domain entries after certificate installation
      ansible.builtin.script:
        cmd: "retire-domain.py {{ domain }} /etc/nginx/sites-available/{{ domain }}"
        executable: python3
      register: final_domain_cleanup
      changed_when: "'Updated ' in final_domain_cleanup.stdout"
    - name: Validate final managed HTTPS configuration
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Activate final HTTPS routing
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
    - name: Verify local HTTPS with the correct hostname and certificate
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --show-error, --noproxy, '*', --resolve, "{{ domain }}:443:127.0.0.1", "https://{{ domain }}/api/identity"]
      register: local_tls_identity
      changed_when: false
      failed_when: local_tls_identity.rc != 0 or 'oob-business-suite' not in local_tls_identity.stdout
    - name: Show current domain address resolution for routing diagnosis
      ansible.builtin.command:
        argv: [getent, ahosts, "{{ domain }}"]
      changed_when: false
      failed_when: false
      register: public_dns
    - name: Report DNS addresses and local HTTPS result
      ansible.builtin.debug:
        msg:
          - "Local HTTPS reaches the correct application. Public DNS addresses: {{ public_dns.stdout_lines }}"
          - "If the public test fails next, compare these addresses with this server and any configured CDN origin."
    - name: Verify readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ app_port }}/health
        status_code: 200
    - name: Verify public HTTPS serves the business suite
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        return_content: true
        status_code: 200
      register: public_page
      retries: 5
      delay: 3
      until: public_page.status == 200 and '/assets/oob-logo.png' in public_page.content
    - name: Verify public branding asset
      ansible.builtin.uri:
        url: "https://{{ domain }}/assets/oob-logo.png"
        status_code: 200
      register: public_logo
      failed_when: public_logo.status != 200 or public_logo.content_type != 'image/png'
    - name: Report browser setup instructions
      ansible.builtin.debug:
        msg: "Open https://{{ domain }}/ to create the first super administrator. Read the private token on the server with: sudo cat /etc/dobhrap-setup.token . Setup closes automatically once an account exists."
    - name: Verify public API reaches this application
      ansible.builtin.uri:
        url: "https://{{ domain }}/api/identity"
        status_code: 200
      register: public_identity
      failed_when: (public_identity.json.application | default('')) != 'oob-business-suite'
  handlers:
    - name: Restart DOBHRAP
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true

