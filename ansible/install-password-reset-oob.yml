---
- name: Install account recovery on the existing OOB deployment
  hosts: dobhrap
  become: true
  gather_facts: true
  vars:
    reset_release: '/opt/dobhrap/releases/password-reset-{{ ansible_date_time.epoch }}'
    reset_source: '{{ playbook_dir }}/..'
    reset_service: oob-business.service
  tasks:
    - name: Require execution on the hosting server
      ansible.builtin.assert:
        that: ansible_connection == 'local'
    - name: Save previous release path
      ansible.builtin.command: readlink -f /opt/dobhrap/current
      register: reset_previous
      changed_when: false
    - name: Verify existing dedicated service
      ansible.builtin.command: 'systemctl cat {{ reset_service }}'
      register: reset_unit
      changed_when: false
    - name: Require expected installed application
      ansible.builtin.assert:
        that:
          - "'/opt/dobhrap/current/app.py' in reset_unit.stdout"
          - "'EnvironmentFile=/etc/dobhrap.env' in reset_unit.stdout"
    - name: Create staged release
      ansible.builtin.file:
        path: '{{ reset_release }}'
        state: directory
        owner: root
        group: dobhrap-app
        mode: '0750'
    - name: Archive committed application source
      ansible.builtin.command:
        argv: [git, -C, '{{ reset_source }}', archive, --format=tar, '--output={{ reset_release }}.tar', HEAD]
    - name: Extract staged application
      ansible.builtin.unarchive:
        src: '{{ reset_release }}.tar'
        dest: '{{ reset_release }}'
        remote_src: true
    - name: Install isolated runtime dependencies
      ansible.builtin.pip:
        requirements: '{{ reset_release }}/requirements.txt'
        virtualenv: '{{ reset_release }}/venv'
        virtualenv_command: python3 -m venv
        extra_args: '--timeout {{ dobhrap_pip_timeout | default(120) | int }} --retries {{ dobhrap_pip_retries | default(5) | int }} --prefer-binary'
      environment:
        PIP_CACHE_DIR: /var/cache/dobhrap/pip
        PIP_FIND_LINKS: '{{ dobhrap_pip_find_links | default("") }}'
        PIP_NO_INDEX: '{{ (dobhrap_pip_offline | default(false) | bool) | ternary("1", "0") }}'
    - name: Verify account recovery before switching releases
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_password_reset.py]
        chdir: '{{ reset_release }}'
    - name: Verify server recovery tooling before touching live data
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_server_recovery.py]
        chdir: '{{ reset_release }}'
    - name: Verify SMTP configuration and encrypted persistence before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_smtp.py]
        chdir: '{{ reset_release }}'
    - name: Verify tax document automation before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_tax_automation.py]
        chdir: '{{ reset_release }}'
    - name: Verify upload events and IRS report isolation before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_tax_analysis_report.py]
        chdir: '{{ reset_release }}'
    - name: Verify federal return and analyst management before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_tax_management.py]
        chdir: '{{ reset_release }}'
    - name: Verify user wallet authorization and atomic settlement before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_wallet.py]
        chdir: '{{ reset_release }}'
    - name: Verify cash-out reservations and permissions before activation
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_cashout.py]
        chdir: '{{ reset_release }}'
    - name: Back up the actual running database backend before migrations
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', '{{ reset_release }}/ansible/active_runtime.py', backup, --service, '{{ reset_service }}', --source, '{{ reset_release }}']
    - name: Deploy and verify recovery routes
      block:
        - name: Create and verify recovery tables in the running backend
          ansible.builtin.command:
            argv: ['{{ reset_release }}/venv/bin/python', '{{ reset_release }}/ansible/active_runtime.py', migrate, --service, '{{ reset_service }}', --source, '{{ reset_release }}']
        - name: Switch application release
          ansible.builtin.file:
            src: '{{ reset_release }}'
            dest: /opt/dobhrap/current
            state: link
            force: true
        - name: Restart web service and initialize recovery tables
          ansible.builtin.systemd:
            name: '{{ reset_service }}'
            state: restarted
        - name: Verify recovery page on local HTTPS
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '10', --noproxy, '*', --resolve, 'olamideolatayobello.com:443:127.0.0.1', https://olamideolatayobello.com/forgot-password]
          register: reset_page
          changed_when: false
          until: reset_page.rc == 0 and 'password-reset.js' in reset_page.stdout
          retries: 8
          delay: 3
        - name: Verify schema using the restarted service database settings
          ansible.builtin.command:
            argv: ['{{ reset_release }}/venv/bin/python', '{{ reset_release }}/ansible/active_runtime.py', verify, --service, '{{ reset_service }}']
          changed_when: false
        - name: Verify reset form and wired JavaScript are served
          ansible.builtin.uri:
            url: 'https://olamideolatayobello.com{{ item.path }}'
            return_content: true
            status_code: 200
            timeout: 15
          loop:
            - {path: /reset-password, marker: password-reset.js}
            - {path: /password-reset.js, marker: /api/password-reset/}
            - {path: /, marker: /forgot-password}
          register: reset_resources
          failed_when: item.marker not in reset_resources.content
          changed_when: false
        - name: Verify POST requests reach the recovery backend without changing passwords
          ansible.builtin.command:
            argv: [curl, --silent, --show-error, --max-time, '10', --noproxy, '*', --resolve, 'olamideolatayobello.com:443:127.0.0.1', '-H', 'Content-Type: application/json', '-H', 'X-Password-Reset-Request: 1', --data, '{}', '-w', '\n%{http_code}', https://olamideolatayobello.com/api/password-reset/complete]
          register: reset_post
          changed_when: false
          failed_when: reset_post.rc != 0 or not reset_post.stdout.endswith('400') or 'Reset link is invalid or expired' not in reset_post.stdout
        - name: Verify existing accounts remain configured
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '10', --noproxy, '*', --resolve, 'olamideolatayobello.com:443:127.0.0.1', https://olamideolatayobello.com/api/setup/status]
          register: reset_health
          changed_when: false
          failed_when: reset_health.rc != 0 or (reset_health.stdout | from_json).required
      rescue:
        - name: Restore previous release
          ansible.builtin.file:
            src: '{{ reset_previous.stdout }}'
            dest: /opt/dobhrap/current
            state: link
            force: true
        - name: Restart previous application
          ansible.builtin.systemd:
            name: '{{ reset_service }}'
            state: restarted
        - name: Report failed installation
          ansible.builtin.fail:
            msg: Recovery installation failed; previous application release restored. Existing credentials and backend selection were preserved.
    - name: Report installed password recovery
      ansible.builtin.debug:
        msg:
          - 'Forgot password, reset completion, signed-in password changes and administrator-issued links are installed.'
          - 'The app initialized password_resets and password_reset_limits in its configured database.'
          - 'Super admin: Provider provisioning & keys > Password recovery email. Configure SMTP host, port, sender, security and optional login.'
          - 'Without SMTP, administrators can issue recovery links from Users; self-service email recovery reports that email is not configured.'

