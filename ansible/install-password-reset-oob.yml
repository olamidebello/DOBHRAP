---
- name: Install account recovery on the existing OOB deployment
  hosts: dobhrap
  become: true
  gather_facts: true
  vars:
    reset_release: '/opt/dobhrap/releases/password-reset-{{ ansible_date_time.epoch }}'
    reset_source: '{{ playbook_dir }}/..'
  tasks:
    - name: Require execution on the hosting server
      ansible.builtin.assert:
        that: ansible_connection == 'local'
    - name: Save previous release path
      ansible.builtin.command: readlink -f /opt/dobhrap/current
      register: reset_previous
      changed_when: false
    - name: Verify existing dedicated service
      ansible.builtin.command: systemctl cat oob-business.service
      register: reset_unit
      changed_when: false
    - name: Require expected installed application
      ansible.builtin.assert:
        that:
          - "'/opt/dobhrap/current/app.py' in reset_unit.stdout"
          - "'EnvironmentFile=/etc/dobhrap.env' in reset_unit.stdout"
    - name: Create staged release
      ansible.builtin.file:
        path: '{{ reset_release }}'
        state: directory
        owner: root
        group: dobhrap-app
        mode: '0750'
    - name: Archive committed application source
      ansible.builtin.command:
        argv: [git, -C, '{{ reset_source }}', archive, --format=tar, '--output={{ reset_release }}.tar', HEAD]
    - name: Extract staged application
      ansible.builtin.unarchive:
        src: '{{ reset_release }}.tar'
        dest: '{{ reset_release }}'
        remote_src: true
    - name: Install isolated runtime dependencies
      ansible.builtin.pip:
        requirements: '{{ reset_release }}/requirements.txt'
        virtualenv: '{{ reset_release }}/venv'
        virtualenv_command: python3 -m venv
    - name: Verify account recovery before switching releases
      ansible.builtin.command:
        argv: ['{{ reset_release }}/venv/bin/python', -m, unittest, discover, -s, tests, -p, test_password_reset.py]
        chdir: '{{ reset_release }}'
    - name: Deploy and verify recovery routes
      block:
        - name: Switch application release
          ansible.builtin.file:
            src: '{{ reset_release }}'
            dest: /opt/dobhrap/current
            state: link
            force: true
        - name: Restart web service and initialize recovery tables
          ansible.builtin.systemd:
            name: oob-business.service
            state: restarted
        - name: Verify recovery page on local HTTPS
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '10', --noproxy, '*', --resolve, 'olamideolatayobello.com:443:127.0.0.1', https://olamideolatayobello.com/forgot-password]
          register: reset_page
          changed_when: false
          until: reset_page.rc == 0 and 'password-reset.js' in reset_page.stdout
          retries: 8
          delay: 3
        - name: Verify existing accounts remain configured
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '10', --noproxy, '*', --resolve, 'olamideolatayobello.com:443:127.0.0.1', https://olamideolatayobello.com/api/setup/status]
          register: reset_health
          changed_when: false
          failed_when: reset_health.rc != 0 or (reset_health.stdout | from_json).required
      rescue:
        - name: Restore previous release
          ansible.builtin.file:
            src: '{{ reset_previous.stdout }}'
            dest: /opt/dobhrap/current
            state: link
            force: true
        - name: Restart previous application
          ansible.builtin.systemd:
            name: oob-business.service
            state: restarted
        - name: Report failed installation
          ansible.builtin.fail:
            msg: Recovery installation failed; previous application release restored. Existing credentials and backend selection were preserved.
    - name: Report installed password recovery
      ansible.builtin.debug:
        msg:
          - 'Forgot password, reset completion, signed-in password changes and administrator-issued links are installed.'
          - 'The app initialized password_resets and password_reset_limits in its configured database.'
          - 'Super admin: Provider provisioning & keys > Password recovery email. Configure SMTP host, port, sender, security and optional login.'
          - 'Without SMTP, administrators can issue recovery links from Users; self-service email recovery reports that email is not configured.'
