---
- name: Recover an existing account without SMTP
  hosts: dobhrap
  become: true
  gather_facts: false
  vars:
    recovery_email: dobcalldemo@gmail.com
    recovery_service: oob-business.service
  tasks:
    - name: Require local execution on the hosting server
      ansible.builtin.assert:
        that: ansible_connection == 'local'
    - name: Generate expiring recovery link using the installed backend
      ansible.builtin.command:
        argv: [/opt/dobhrap/current/venv/bin/python, /opt/dobhrap/current/ansible/recover-password.py, --email, '{{ recovery_email }}', --service, '{{ recovery_service }}']
      no_log: true
    - name: Report recovery link location
      ansible.builtin.debug:
        msg:
          - 'Recovery link created for {{ recovery_email }}. Password and roles are unchanged until the link is used.'
          - 'Read it with: cat /root/oob-password-reset-link.txt'
          - 'Open the link within 15 minutes and choose a new password. No email configuration is needed.'

