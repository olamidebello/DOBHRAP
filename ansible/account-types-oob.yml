---
- import_playbook: repair-oob.yml

- name: Verify Personal and Business account registration resources
  hosts: dobhrap
  become: true
  gather_facts: false
  tasks:
    - name: Verify published account-type selector on both registration entry points
      ansible.builtin.uri:
        url: 'https://olamideolatayobello.com/{{ item }}'
        return_content: true
        status_code: 200
      loop: [register, tax-services]
      register: account_interface
      failed_when: "'registration-type' not in account_interface.content or 'registration-submit' not in account_interface.content"
      changed_when: false
    - name: Verify account-type database column in the active backend
      ansible.builtin.command:
        argv:
          - /opt/dobhrap/current/venv/bin/python
          - -c
          - "import sys;sys.path.insert(0,'/opt/dobhrap/current/ansible');from active_runtime import load_active;a=load_active('oob-business.service');c=a.connect();c.execute('SELECT id,service_mode FROM tenants LIMIT 1');c.close();print('Personal/business account storage verified; no accounts created or modified')"
      changed_when: false
